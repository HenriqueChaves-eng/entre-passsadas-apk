name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apk/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android-apk

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar app offline
        run: npx cap sync android

      - name: Gerar APK debug
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ajuste-entre-passadas-debug-apk
          path: android-apk/android/app/build/outputs/apk/debug/app-debug.apk
